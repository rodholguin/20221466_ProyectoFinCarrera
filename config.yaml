# =====================================================================
# Configuración del pipeline de extracción (OE2 / R3–R6)
# Tesis DRL aplicado a la BVL — Rodrigo Holguin / Asesor: Dr. E. Villanueva
# =====================================================================

# Horizonte de estudio (ISO 8601). 20 años.
# OJO: 2005–2007 suele venir incompleto en fundamentales (lo reportó la
# maestría de Ancajima: ~25% vacío 2004–2006). Plan de relleno en R4.
period:
  start: "2005-01-01"
  end:   "2025-12-31"

# Universo de activos (7). REVISADO jul-2026 por liquidez (riesgo #1): se
# reemplazaron SAGAC1 (2.2% días operados), CORAREC1 (20.8%) y BUENAVC1 (23.7%,
# ilíquida en BVL) por nombres BVL-nativos más líquidos, y se amplió a 7 para
# atacar el sesgo de universo chico. Cada candidato se validó en las 3 patas
# (liquidez BVL + fundamentales SMV + cobertura mediática). Ya NO es "uno por
# sector" estricto, sino "activos líquidos representativos".
# - bvl    : ticker en la Bolsa de Valores de Lima (fuente primaria)
# - smv_rpj: código RPJ del emisor en la SMV (= rpjCode de la BVL; cross-validado)
# - bvl_company_code: companyCode BVL para /v1/issuers/{cc}/value (dividendos +
#            acciones liberadas + acciones en circulación)
universe:
  - sector: banca
    name: "Banco de Credito del Peru (BCP)"
    bvl: "CREDITC1"
    yahoo: "CREDITC1.LM"
    smv: "BANCO DE CREDITO DEL PERU"
    smv_rpj: "B80005"
    bvl_company_code: "12000"
    nominal_value: 1.0         # cuentas capital banco SBS 1F3301/1F3314
    isin: "PEP120001008"
    xcheck: "BAP"              # Credicorp Ltd (NYSE): validación cruzada, NO reemplazo
    notes: >
      Cotiza en PEN. Reporta a la SMV en soles (taxonomía SBS, mapear aparte).
      Liquidez baja (free float ~33k acc/día): modelar costo de iliquidez en OE1.

  - sector: minero
    name: "Minsur"
    bvl: "MINSURI1"            # ACCIÓN DE INVERSIÓN (la común de Breca no cotiza)
    yahoo: null
    smv: "MINSUR S.A."
    smv_rpj: "A20032"          # reporta en USD (Moneda=Dólares)
    bvl_company_code: "62200"
    nominal_value: 1.0         # S/ por acción (BVL). SMV en USD -> se usa el override
    shares_outstanding_override: 2883002520  # TOTAL económico = 3 × 961,000,840
                               # (la acción de inversión es 1/3 del patrimonio: cuentas
                               # SMV 1D0703=300,634 vs 1D0701=601,269, exactamente 2:1,
                               # PLANAS 2012-2025). Con el total, eps_ttm=utilidad/total
                               # y el P/E de la acción de inversión sale correcto.
    isin: null
    notes: >
      Reemplaza a BUENAVC1 (jul-2026): liquidez 64.9% vs 23.7%, y rentable 7/9 años
      (P/E usable) vs BVN 2/9 (P/E casi siempre NaN). Reporta USD -> utilidad USD→PEN
      automática (TC BCRP). Precio en PEN (~S/5.3), NO se convierte. Estaño (#2 mundial)
      + cobre (Mina Justa). Conteo perfectamente estable (sin emisiones/recompras).

  - sector: alimentos
    name: "Alicorp"
    bvl: "ALICORC1"
    yahoo: "ALICORC1.LM"
    smv: "ALICORP S.A.A."
    smv_rpj: "B30006"
    bvl_company_code: "21400"  # 34 dividendos en S/.
    nominal_value: 1.0         # Tesorería 1D0711 material (hasta 10% 2022-2023)
    isin: null

  - sector: retail
    name: "InRetail Peru Corp"
    bvl: "INRETC1"
    yahoo: null
    smv: "INRETAIL PERU CORP"
    smv_rpj: "OE5087"
    smv_tipo: "C"              # CONSOLIDADO (holding; su individual da pérdida:
                               # 2023Q4 consolidado +321,717 vs individual -40,729
                               # miles S/). Lo consume fetch_smv (implementado).
    bvl_company_code: "74222"
    nominal_value: 0.0         # SIN valor nominal (holding Panamá) -> se usa el override
    # Conteo por TRAMOS (no override constante): el follow-on fue exactamente en
    # 2022-Q2 (Capital Emitido SMV 1D0701 plano en 2,739,714 desde 2012 hasta
    # 2022-Q1 y salta a 2,962,923 en 2022-Q2; tesorería 1D0711 = 0 siempre).
    # Conteo OFICIAL mes a mes, del Informe Bursátil Mensual de la BVL
    # (data/interim/bvl_mensual.parquet, ver src/market/bvl_infmen.py).
    # SUSTITUYE (jul-2026) a la reconstrucción por razón de Capital Emitido, que
    # daba 100,556,000 para el tramo pre-2022: el oficial es 102,807,319, así que
    # la reconstrucción erraba -2.19% (algo por encima del <=2% que se había
    # declarado). Con esto la limitación se ELIMINA, no solo se acota.
    shares_outstanding_schedule:
      # Pre-IPO. Solo alcanza al periodo 2012Q3, que no tiene TTM todavía, así que
      # no produce ningún P/E; se deja por fidelidad al registro oficial.
      - ["2012-09-01", 79807319]
      # IPO de octubre 2012.
      - ["2012-10-01", 102807319]
      # Follow-on: la BVL lo registra en ABRIL 2022 (antes se suponía 2022-06-30
      # por el salto del Capital Emitido en 2022-Q2; abril cae dentro de ese
      # trimestre, así que el efecto sobre los periodos trimestrales es el mismo).
      - ["2022-04-01", 108746887]
    price_currency: "USD"      # cotiza en US$ (~27) -> close US$→PEN con TC BCRP vigente
                               # (market_client._to_pen, implementado; ~S/96-120 en 2025)
    isin: "PAL1801171A1"
    notes: >
      Reemplaza a SAGAC1 (jul-2026). Único retail líquido (63.1%) con prensa (11.8/sem).
      COMPLEJO: precio en US$ (convertir a PEN), sin valor nominal, fundamentales
      consolidados. Acciones estables, un solo follow-on 2022-Q2 (100.56M -> 108.75M).

  - sector: construccion
    name: "Cementos Pacasmayo"
    bvl: "CPACASC1"           # común; existe también CPACASI1 (inversión)
    yahoo: null
    smv: "CEMENTOS PACASMAYO S.A.A."
    smv_rpj: "CD0005"
    bvl_company_code: "23950"
    nominal_value: 1.0
    isin: "PEP239501005"
    notes: >
      Reemplaza a CORAREC1 (jul-2026). El candidato más completo: liquidez 72.1%,
      prensa 14.3/sem, reporta en soles.

  - sector: bienes_capital
    name: "Ferreycorp"
    bvl: "FERREYC1"
    yahoo: null
    smv: "FERREYCORP S.A.A."
    smv_rpj: "B60001"
    bvl_company_code: "73600"
    nominal_value: 1.0
    isin: "PEP736001004"
    notes: >
      Nuevo (jul-2026). Sector no representado antes (bienes de capital / distribución
      Caterpillar). Liquidez 73.5%, prensa 5.0/sem, soles. Tiene acciones liberadas (AL).

  - sector: utilities
    name: "Luz del Sur"
    bvl: "LUSURC1"
    yahoo: null
    smv: "LUZ DEL SUR S.A.A."
    smv_rpj: "B40008"
    bvl_company_code: "70252"
    nominal_value: 0.68
    isin: "PEP702521001"
    notes: >
      Nuevo (jul-2026, utilities). Liquidez 56.5%, prensa 2.8/sem, soles. 55 dividendos.

# ---------------------------------------------------------------------
# Fuentes de datos
# ---------------------------------------------------------------------
sources:
  market:
    # Primaria: BVL. Secundaria/fallback: Yahoo. Se reconcilian cierres.
    primary: "bvl"
    fallback: "yahoo"
    # El endpoint exacto de cotizaciones de la BVL NO está documentado.
    # Probar la familia dataondemand v1 (la maestría usó /financialstatements/)
    # y/o capturar el XHR del sitio con DevTools. Ver src/market/bvl_client.py
    bvl_base_url: "https://dataondemand.bvl.com.pe/v1"

  fundamentals:
    # MÁS SEGURA = SMV (regulador, presentación legal obligatoria, datos
    # abiertos del Estado, estructurado). BVL dataondemand como secundaria
    # y para validación cruzada (es la que ya programó la maestría).
    primary: "smv"
    fallback: "bvl_dataondemand"
    smv_wsdl: "https://mvnet.smv.gob.pe/ws_od_eeff/WebServiceInfoFinanciera.asmx?WSDL"
    bvl_dataondemand_url: "https://dataondemand.bvl.com.pe/v1/financialstatements/"
    frequency: "trimestral"   # también anual

  sentiment:
    # Media Cloud API v4. story_list EXIGE collection_ids o sources.
    # El token va por variable de entorno MEDIACLOUD_API_TOKEN.
    peru_national_collection_id: 34412158  # "Peru - National" (confirmado con DirectoryApi)
    llm_provider: "ollama"              # ollama (gemma3:4b local)
    llm_model: "gemma3:4b"              # modelo Ollama local
    daily_aggregation: "mean"           # mean | net_sentiment
    # Solo medios económicos peruanos de referencia. Excluye tabloides,
    # medios deportivos y fuentes extranjeras que se cuelan en la colección
    # nacional de MediaCloud (ej: eltiempo.com colombiano).
    source_allowlist:
      - "gestion.pe"
      - "elcomercio.pe"
      - "larepublica.pe"

  # Features macroeconómicos globales (BCRP). Ver src/macro/macro_client.py y
  # docs/fundamento_macro_riesgo_politico.txt. Series validadas 2012-2025.
  macro:
    provider: "bcrp"
    api_url: "https://estadisticas.bcrp.gob.pe/estadisticas/series/api"
    series:
      tc_usdpen:  "PD04640PD"   # diaria (ya en src/market/fx.py)
      cobre:      "PD04701XD"   # diaria (Londres, cUS$/lb)
      oro:        "PD04704XD"   # diaria (Londres, US$/oz troy)
      embi:       "PD04709XD"   # diaria (Spread EMBIG Perú, pbs)
      tasa_ref:   "PD04722MM"   # mensual (tasa de referencia BCRP, %)
      inflacion:  "PN01271PM"   # mensual (IPC Lima, var% mensual)

paths:
  raw:       "data/raw"
  interim:   "data/interim"
  processed: "data/processed"
